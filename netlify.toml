[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# ── API proxy — forwards /api/* to the Cloudflare tunnel ─────────────────────
# When the tunnel URL changes, update ONLY the "to" line below.
[[redirects]]
  from = "/api/*"
  to = "https://emacs-hair-deals-chapter.trycloudflare.com/api/:splat"
  status = 200
  force = true

# ── SPA routing — all other routes go to index.html for React Router ─────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
